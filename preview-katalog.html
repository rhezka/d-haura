<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D'Haura — Kue & Nutrisi</title>
<style>:root { --bg:#fff8f0; --ink:#3d2b1f; --card:#ffffff; --line:#ecdcc8; --acc:#b3541e; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
.top { padding:28px 18px 18px; text-align:center; }
.brand { font-size:42px; font-weight:800; letter-spacing:.5px; }
.tag { opacity:.75; margin:4px 0 14px; }
.actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.btn { background:var(--acc); color:#fff; padding:12px 18px; border-radius:999px; text-decoration:none; font-weight:700; display:inline-block; }
.btn.ghost { background:transparent; color:var(--acc); border:2px solid var(--acc); }
main { max-width:900px; margin:0 auto; padding:0 14px 40px; }
.notice { background:#fff3cd; border:1px solid #e6cf8a; padding:10px 14px; border-radius:12px; margin:10px 0 18px; font-size:14px; }
h2 { margin:26px 0 4px; }
.sub { margin:0 0 12px; opacity:.75; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.card img { width:100%; height:150px; object-fit:cover; display:block; background:#f3e7d7; }
.imgwrap { position:relative; }
.card .imgwrap img { cursor:zoom-in; }
#modal { position:fixed; inset:0; z-index:50; display:none; }
.mback { position:absolute; inset:0; background:rgba(0,0,0,.6);
  display:flex; align-items:center; justify-content:center; padding:16px; }
.mbox { background:#fff; border-radius:16px; max-width:440px; width:100%;
  max-height:90vh; overflow:auto; padding:14px; position:relative; }
.mbox #mMain { width:100%; height:240px; object-fit:cover; border-radius:12px; background:#f3e7d7; }
.mth { display:flex; gap:8px; margin:10px 0; }
.mth img { width:64px; height:64px; object-fit:cover; border-radius:10px;
  opacity:.55; border:2px solid transparent; cursor:pointer; }
.mth img.on { opacity:1; border-color:var(--acc); }
.mx { position:absolute; top:22px; right:22px; background:rgba(0,0,0,.55);
  border-radius:999px; padding:8px 14px; font-size:13px; }
.mdesc { font-size:14px; margin:8px 0 12px; line-height:1.6; }
.card .pad { padding:10px 12px 14px; }
.card .name { font-weight:800; }
.card .price { color:var(--acc); font-weight:800; margin-top:4px; }
.card .desc { font-size:13px; opacity:.75; margin-top:4px; }
.badge { display:inline-block; font-size:12px; font-weight:800; background:#1e7e34; color:#fff; border-radius:999px; padding:2px 10px; margin-top:6px; }
.badge.pending { background:#8a6d00; }
.card .order { margin-top:10px; display:block; text-align:center; font-size:14px; padding:9px 10px; }
.info ul { line-height:1.8; }
footer { text-align:center; padding:26px; opacity:.6; font-size:13px; }
/* admin */
.wrap { max-width:900px; margin:0 auto; padding:14px 14px 60px; }
input,select,textarea { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); font-size:15px; margin:6px 0; background:#fff; }
button { background:var(--acc); color:#fff; border:0; border-radius:10px; padding:11px 14px; font-weight:800; font-size:15px; }
button.secondary { background:#6c757d; }
.row { display:flex; gap:8px; flex-wrap:wrap; }
.row > * { flex:1; min-width:140px; }
.dash { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin:12px 0; }
.stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; }
.stat .n { font-size:26px; font-weight:800; }
.stat .l { font-size:13px; opacity:.7; }
.cust { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; }
.cust .nm { font-weight:800; font-size:17px; }
.hist { font-size:13px; opacity:.85; margin-top:6px; line-height:1.7; }
.small { font-size:13px; opacity:.7; }
.bar { height:10px; background:#f0e2cf; border-radius:999px; overflow:hidden; margin-top:6px; }
.bar > div { height:100%; background:var(--acc); }
.chart { width:100%; height:auto; background:#fff; border:1px solid var(--line); border-radius:12px; }
.chart rect { fill:var(--acc); }
.chart .cl { font-size:11px; fill:#8a7a68; text-anchor:middle; }
.chart .cv { font-size:12px; font-weight:800; fill:#3d2b1f; text-anchor:middle; }
.krow { margin:8px 0; }
.krow .kl { font-size:14px; font-weight:700; }
.vform { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.vform input[type="date"] { flex:1; min-width:130px; }
.vform input:not([type]) { flex:2; min-width:130px; }
.vform button { flex:1; min-width:90px; }
.appnav { display:flex; flex-direction:column; gap:6px; padding:10px 14px 6px;
  background:#ffffff; border-bottom:1px solid var(--line);
  box-shadow:0 2px 10px rgba(0,0,0,.12); }
.navrow { display:flex; gap:8px; }
.navrow button { flex:1; }
.vtag { font-size:10px; color:#bbb; text-align:right; }
.appnav button { flex:1; }
.appnav button.off { background:#6c757d; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">d’haura</div>
  <div class="tag">Kue & nutrisi harian</div>
  <div class="actions">
    <a class="btn" id="waOrder" href="https://wa.me/6280000000000?text=Halo%20D%27Haura%2C%20saya%20mau%20tanya-tanya%20dulu" target="_blank" rel="noopener">Pesan via WA</a>
    <a class="btn ghost" href="admin.html">Admin</a>
  </div>
</header>

<main>
  <section>
    <h2>Kue</h2>
    <p class="sub">Ketuk foto untuk melihat detail.</p>
    <div class="grid" id="kueGrid"></div>
  </section>

  <section>
    <h2>Herbalife</h2>
    <p class="sub">Ketuk foto untuk melihat detail.</p>
    <div class="grid" id="herbaGrid"></div>
  </section>

  <section class="info">
    <h2>Info toko</h2>
    <ul>
      <li>Alamat dan jam buka: menyusul.</li>
      <li>Pembayaran: tunai dan QRIS D'Haura.</li>
      <li>Pesanan acara: hubungi minimal 3 hari sebelumnya.</li>
    </ul>
  </section>
</main>

<footer>
  d-haura.my.id
</footer>
<div id="modal" style="display:none"></div>

<script>// Data final (struktur). Foto, nama, dan harga menyusul data asli.
const WA_NUMBER = "6280000000000"; // GANTI nomor WA

const U = (id) => "https://images.unsplash.com/" + id + "?w=600&q=80";
const IMG = {
  roti: U("photo-1608198093002-ad4e005484ec"),
  cokelat: U("photo-1578985545062-69928b1d9587"),
  stroberi: U("photo-1565958011703-44f9829ba187"),
  cupcake: U("photo-1486427944299-d1955d23e34d"),
  kukis: U("photo-1499636136210-6f4ee915583e"),
  salad: U("photo-1512621776951-a57141f2eefd"),
  mangkuk: U("photo-1490645935967-10de6ba17061"),
  bowl: U("photo-1546069901-ba9599a7e63c"),
  segar: U("photo-1540189549336-e6e99c3679fe"),
};

const KUE = [
  { nama:"Bolu Pandan", harga:25000, halal:true, img:IMG.roti,
    photos:[IMG.roti, IMG.cupcake, IMG.kukis],
    desc:"Bolu kukus aroma pandan, lembut dan tidak seret. Cocok untuk arisan dan hajatan." },
  { nama:"Brownies Kukus", harga:30000, halal:false, img:IMG.cokelat,
    photos:[IMG.cokelat, IMG.stroberi, IMG.kukis],
    desc:"Brownies kukus cokelat, legit di tengah. Tersedia loyang dan potong." },
  { nama:"Lapis Pelangi", harga:20000, halal:false, img:IMG.stroberi,
    photos:[IMG.stroberi, IMG.cokelat, IMG.cupcake],
    desc:"Lapis kukus warna-warni, kenyal dan manisnya pas." },
  { nama:"Putu Ayu", harga:15000, halal:false, img:IMG.cupcake,
    photos:[IMG.cupcake, IMG.roti, IMG.kukis],
    desc:"Putu ayu kelapa parut gurih, dikukus dadakan tiap pagi." },
  { nama:"Kue Kering", harga:35000, halal:false, img:IMG.kukis,
    photos:[IMG.kukis, IMG.cupcake, IMG.roti],
    desc:"Kue kering renyah untuk hampers dan pesanan acara." },
];

const HERBA = [
  { nama:"Shake Nutrisi", harga:0, img:IMG.salad,
    photos:[IMG.salad, IMG.bowl, IMG.segar],
    desc:"Minuman nutrisi praktis untuk pendamping sarapan harian. Varian rasa tanya via WA." },
  { nama:"Teh Herbal", harga:0, img:IMG.mangkuk,
    photos:[IMG.mangkuk, IMG.salad, IMG.segar],
    desc:"Teh herbal untuk teman aktivitas harian. Aturan pakai dijelaskan saat pesan." },
  { nama:"Aloe Pendamping", harga:0, img:IMG.bowl,
    photos:[IMG.bowl, IMG.mangkuk, IMG.salad],
    desc:"Minuman aloe untuk pendamping program harian." },
];

function rupiah(n){ if(!n) return "Tanya via WA"; return "Rp " + n.toLocaleString("id-ID"); }
function waLink(nama){
  const t = encodeURIComponent("Halo D'Haura, saya mau tanya " + nama);
  return "https://wa.me/" + WA_NUMBER + "?text=" + t;
}
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function card(p, kind, i){
  return '<div class="card">' +
    '<div class="imgwrap"><img loading="lazy" src="' + p.img + '" alt="' + esc(p.nama) + '" onclick="openDetail(\'' + kind + '\',' + i + ')" onerror="this.style.display=\'none\'"></div>' +
    '<div class="pad"><div class="name">' + esc(p.nama) + '</div>' +
    '<div class="price">' + rupiah(p.harga) + '</div>' +
    '<a class="btn order" target="_blank" rel="noopener" href="' + waLink(p.nama) + '">Tanya / Pesan</a>' +
    '</div></div>';
}
let GAL = [];
function openDetail(kind, i){
  const p = (kind === "k" ? KUE : HERBA)[i];
  GAL = (p.photos && p.photos.length) ? p.photos : [p.img];
  const thumbs = GAL.map((s,j) => '<img src="' + s + '" onclick="setPhoto(' + j + ')" class="' + (j === 0 ? "on" : "") + '" loading="lazy" alt="">').join("");
  document.getElementById("modal").innerHTML =
    '<div class="mback" onclick="closeModal()"><div class="mbox" onclick="event.stopPropagation()">' +
    '<button class="mx" onclick="closeModal()">Tutup</button>' +
    '<img id="mMain" src="' + GAL[0] + '" alt="' + esc(p.nama) + '">' +
    '<div class="mth">' + thumbs + '</div>' +
    '<div class="name">' + esc(p.nama) + '</div>' +
    '<div class="price">' + rupiah(p.harga) + '</div>' +
    '<div class="mdesc">' + esc(p.desc) + '</div>' +
    '<a class="btn order" style="display:block;text-align:center" target="_blank" rel="noopener" href="' + waLink(p.nama) + '">Tanya / Pesan</a>' +
    '</div></div>';
  document.getElementById("modal").style.display = "block";
}
function setPhoto(j){
  document.getElementById("mMain").src = GAL[j];
  const ts = document.querySelectorAll(".mth img");
  for(let k = 0; k < ts.length; k++) ts[k].className = (k === j ? "on" : "");
}
function closeModal(){
  const m = document.getElementById("modal");
  m.style.display = "none"; m.innerHTML = "";
}
function renderPublic(){
  const kg = document.getElementById("kueGrid");
  const hg = document.getElementById("herbaGrid");
  if(kg) kg.innerHTML = KUE.map((p,i) => card(p,"k",i)).join("");
  if(hg) hg.innerHTML = HERBA.map((p,i) => card(p,"h",i)).join("");
  const wo = document.getElementById("waOrder");
  if(wo) wo.href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent("Halo D'Haura, saya mau tanya-tanya dulu");
}
</script>
<script>
  renderPublic();
</script>
</body>
</html>
