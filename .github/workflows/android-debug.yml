name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'app.js'
      - 'style.css'
      - 'img/**'
      - 'www/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: mkdir -p www && cp index.html admin.html app.js style.css www/ && cp -r img www/ && npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dhaura-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
